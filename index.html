<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDo App</title>
  </head>
  <body class="bg-stone-100">
    <header class="py-4 mt-5 text-center font-thin mx-auto">
      <h1 class="font-sans text-7xl text-rose-700">~ todo ~</h1>
    </header>
    <nav
      id="todo-nav"
      class="flex items-center justify-center py-2 gap-3 mx-auto"
      role="navigation"
    >
      <a
        href="#/"
        class="underline underline-offset-4 decoration-rose-700 decoration-2 p-1"
        role="button"
        >All</a
      >
      <a href="#/active" role="button">Active</a>
      <a href="#/completed" role="button">Completed</a>
    </nav>
    <main class="max-w-lg mx-auto font-thin bg-white shadow-md">
      <input
        id="new-todo"
        placeholder="What needs to be done?"
        autofocus
        class="p-4 w-full text-2xl italic outline-0 focus:outline-1 focus:outline-offset-0 focus:outline-rose-700"
      />
      <section id="todo-list" class="w-full text-xl font-normal"></section>
    </main>
    <footer
      class="flex flex-col justify-center items-center mt-10 text-xs text-gray-500 font-extralight mx-auto"
    >
      <div>Click to complete a todo</div>
      <div>Double-click to edit a todo</div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
